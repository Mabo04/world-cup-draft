<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>World Cup Draft</title>
  <style>
    :root {
      --ink: #17211c;
      --muted: #647067;
      --paper: #fffdf5;
      --line: #d9d4c3;
      --grass: #0f6b3f;
      --grass-dark: #083f29;
      --lime: #d8ff69;
      --gold: #f3bd3b;
      --red: #d84a35;
      --white: #ffffff;
      --shadow: 0 18px 50px rgba(23, 33, 28, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 0%, rgba(216, 255, 105, 0.45), transparent 32rem),
        linear-gradient(135deg, #fffdf5 0%, #eef5df 50%, #d6ead5 100%);
      min-height: 100vh;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .shell {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 18px;
    }

    .topbar {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .ball {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--ink);
      color: var(--paper);
      font-weight: 900;
      box-shadow: var(--shadow);
    }

    h1 {
      margin: 0;
      font-size: clamp(1.45rem, 6vw, 3.2rem);
      line-height: 1;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }

    .primary,
    .ghost,
    .danger {
      border-radius: 999px;
      padding: 11px 14px;
      font-weight: 800;
      min-height: 42px;
    }

    .primary {
      color: var(--grass-dark);
      background: var(--lime);
      box-shadow: 0 8px 22px rgba(15, 107, 63, 0.22);
    }

    .ghost {
      color: var(--ink);
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid var(--line);
    }

    .danger {
      color: var(--white);
      background: var(--red);
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 7px;
      position: sticky;
      top: 0;
      z-index: 3;
      padding: 8px 0 12px;
      backdrop-filter: blur(12px);
    }

    .tab {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.68);
      color: var(--muted);
      padding: 10px 8px;
      font-weight: 900;
    }

    .tab.active {
      background: var(--grass);
      color: var(--white);
      border-color: var(--grass);
    }

    .panel {
      display: none;
      animation: rise 260ms ease both;
    }

    .panel.active {
      display: block;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .grid {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 14px;
    }

    .card {
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid rgba(217, 212, 195, 0.9);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 16px;
    }

    .card h2,
    .card h3 {
      margin: 0 0 12px;
      letter-spacing: 0;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 800;
    }

    input,
    select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: var(--white);
      color: var(--ink);
      outline: 0;
    }

    input:focus,
    select:focus {
      border-color: var(--grass);
      box-shadow: 0 0 0 3px rgba(15, 107, 63, 0.16);
    }

    .player-list,
    .team-grid,
    .score-grid,
    .group-grid {
      display: grid;
      gap: 8px;
    }

    .player-row,
    .team-row,
    .score-row,
    .rank-row {
      display: grid;
      gap: 8px;
      align-items: center;
    }

    .player-row {
      grid-template-columns: 1fr auto;
    }

    .team-row {
      grid-template-columns: 1.2fr 0.7fr 0.85fr 0.85fr;
    }

    .group-grid {
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 12px;
    }

    .group-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.9);
    }

    .group-card h3 {
      margin-bottom: 10px;
    }

    .group-team {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 8px;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
    }

    .group-team:last-child {
      border-bottom: 0;
    }

    .group-team-meta {
      min-width: 0;
    }

    .move-buttons {
      display: flex;
      gap: 6px;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--white);
      color: var(--ink);
      font-weight: 900;
    }

    .icon-btn:disabled {
      opacity: 0.45;
      cursor: default;
    }

    .score-row {
      grid-template-columns: 1fr 86px;
    }

    .rank-row {
      grid-template-columns: auto 1fr auto;
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
    }

    .rank-row:last-child {
      border-bottom: 0;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 32px;
      height: 32px;
      border-radius: 999px;
      background: var(--ink);
      color: var(--white);
      font-weight: 900;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      padding: 5px 9px;
      background: #edf5e3;
      color: var(--grass-dark);
      font-size: 0.78rem;
      font-weight: 900;
      white-space: nowrap;
    }

    .draft-board {
      display: grid;
      gap: 10px;
    }

    .draft-now {
      background: linear-gradient(135deg, var(--grass), var(--grass-dark));
      color: var(--white);
      border-radius: 8px;
      padding: 18px;
      position: relative;
      overflow: hidden;
    }

    .draft-now::after {
      content: "";
      position: absolute;
      right: -40px;
      top: -55px;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      border: 22px solid rgba(216, 255, 105, 0.32);
    }

    .draft-now p {
      margin: 0;
      color: rgba(255, 255, 255, 0.78);
      font-weight: 800;
    }

    .draft-now strong {
      display: block;
      margin-top: 5px;
      font-size: 1.9rem;
      line-height: 1;
    }

    .pick-zone {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
    }

    .team-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(132px, 1fr));
      gap: 8px;
    }

    .team-chip {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
      min-height: 46px;
      padding: 10px;
      border-radius: 8px;
      background: var(--white);
      border: 1px solid var(--line);
    }

    .team-chip.taken {
      color: var(--muted);
      background: #f2efe3;
    }

    .small {
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.6;
    }

    .leader-score {
      font-size: 1.35rem;
      font-weight: 1000;
    }

    .owned {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 20px;
      z-index: 10;
      transform: translateX(-50%) translateY(20px);
      max-width: min(92vw, 440px);
      border-radius: 999px;
      padding: 12px 16px;
      background: var(--ink);
      color: var(--white);
      opacity: 0;
      pointer-events: none;
      transition: 180ms ease;
      box-shadow: var(--shadow);
      font-weight: 800;
      text-align: center;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 780px) {
      .shell {
        padding: 12px;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .actions {
        width: 100%;
        justify-content: stretch;
      }

      .actions button {
        flex: 1 1 auto;
      }

      .grid,
      .form-grid {
        grid-template-columns: 1fr;
      }

      .tabs {
        grid-template-columns: repeat(5, minmax(0, 1fr));
      }

      .tab {
        padding: 10px 4px;
        font-size: 0.82rem;
      }

      .team-row {
        grid-template-columns: 1fr;
        border-bottom: 1px solid var(--line);
        padding-bottom: 8px;
      }

      .group-team {
        grid-template-columns: auto 1fr;
      }

      .move-buttons {
        grid-column: 1 / -1;
        justify-content: flex-end;
      }

      .pick-zone {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="ball">WC</div>
        <div>
          <h1>World Cup Draft</h1>
          <p class="subtitle">友達と国を取り合って、結果の合計点で勝負。</p>
        </div>
      </div>
      <div class="actions">
        <button class="ghost" id="shareBtn">共有リンク</button>
        <button class="ghost" id="exportBtn">データ保存</button>
        <button class="danger" id="resetBtn">リセット</button>
      </div>
    </header>

    <nav class="tabs" aria-label="画面切り替え">
      <button class="tab active" data-tab="setup">設定</button>
      <button class="tab" data-tab="draft">ドラフト</button>
      <button class="tab" data-tab="live">ライブ</button>
      <button class="tab" data-tab="results">結果入力</button>
      <button class="tab" data-tab="standings">順位</button>
    </nav>

    <section class="panel active" id="setup">
      <div class="grid">
        <div class="card">
          <h2>参加者</h2>
          <div class="form-grid">
            <label>参加人数
              <input id="playerCount" type="number" min="2" max="16" value="8">
            </label>
            <label>ドラフト方式
              <select id="draftMode">
                <option value="snake">折り返しドラフト</option>
                <option value="straight">毎巡同じ順番</option>
              </select>
            </label>
          </div>
          <div class="player-list" id="playerList" style="margin-top: 12px;"></div>
          <button class="primary" id="applyPlayers" style="width: 100%; margin-top: 12px;">参加者を反映</button>
          <p class="small" id="slotHint"></p>
        </div>

        <div class="card">
          <h2>得点ルール</h2>
          <div class="score-grid" id="scoreRules"></div>
          <h3 style="margin-top: 18px;">グループ順位点</h3>
          <div class="score-grid" id="groupScoreRules"></div>
          <p class="small">チームの合計点は「グループ順位点 + 到達ステージ点」です。</p>
        </div>
      </div>
    </section>

    <section class="panel" id="draft">
      <div class="grid">
        <div class="card draft-board">
          <div class="draft-now">
            <p>次の指名</p>
            <strong id="currentPicker">未設定</strong>
          </div>
          <div class="pick-zone">
            <select id="teamSelect"></select>
            <button class="primary" id="pickBtn">この国を取る</button>
          </div>
          <div class="actions">
            <button class="ghost" id="undoBtn">1つ戻す</button>
            <button class="ghost" id="autoBtn">未指名を自動配分</button>
          </div>
          <p class="small" id="draftHint"></p>
        </div>
        <div class="card">
          <h2>指名済み</h2>
          <div id="draftSummary"></div>
        </div>
      </div>
    </section>

    <section class="panel" id="live">
      <div class="grid">
        <div class="card">
          <h2>外部結果を取得</h2>
          <label>結果フィードURL
            <input id="feedUrl" type="url" placeholder="https://example.com/world-cup-results.json">
          </label>
          <div class="actions" style="margin-top: 12px;">
            <button class="primary" id="syncBtn">結果を取得</button>
            <button class="ghost" id="sampleBtn">サンプル形式</button>
          </div>
          <p class="small" id="syncStatus"></p>
        </div>
        <div class="card">
          <h2>現在の試合結果</h2>
          <div id="matchList"></div>
        </div>
      </div>
    </section>

    <section class="panel" id="results">
      <div class="card">
        <h2>チーム結果</h2>
        <div class="group-grid" id="teamRows"></div>
      </div>
    </section>

    <section class="panel" id="standings">
      <div class="grid">
        <div class="card">
          <h2>総合順位</h2>
          <div id="leaderboard"></div>
        </div>
        <div class="card">
          <h2>未入力チェック</h2>
          <div id="missingResults"></div>
        </div>
      </div>
    </section>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    const STORAGE_KEY = "world-cup-draft-v1";
    const defaultTeams = [
      "アルジェリア", "アルゼンチン", "オーストラリア", "オーストリア", "ベルギー", "ボスニア・ヘルツェゴビナ",
      "ブラジル", "カナダ", "カーボベルデ", "コロンビア", "コンゴ民主共和国", "コスタジボワール",
      "クロアチア", "キュラソー", "チェコ", "エクアドル", "エジプト", "イングランド",
      "フランス", "ドイツ", "ガーナ", "ハイチ", "イラン", "イラク",
      "日本", "ヨルダン", "韓国", "メキシコ", "モロッコ", "オランダ",
      "ニュージーランド", "ノルウェー", "パナマ", "パラグアイ", "ポルトガル", "カタール",
      "サウジアラビア", "スコットランド", "セネガル", "南アフリカ", "スペイン", "スウェーデン",
      "スイス", "チュニジア", "トルコ", "アメリカ合衆国", "ウルグアイ", "ウズベキスタン"
    ];

    const groups = {
      "グループA": ["メキシコ", "南アフリカ", "韓国", "チェコ"],
      "グループB": ["カナダ", "ボスニア・ヘルツェゴビナ", "カタール", "スイス"],
      "グループC": ["ブラジル", "モロッコ", "ハイチ", "スコットランド"],
      "グループD": ["アメリカ合衆国", "パラグアイ", "オーストラリア", "トルコ"],
      "グループE": ["ドイツ", "キュラソー", "コートジボワール", "エクアドル"],
      "グループF": ["オランダ", "日本", "スウェーデン", "チュニジア"],
      "グループG": ["ベルギー", "エジプト", "イラン", "ニュージーランド"],
      "グループH": ["スペイン", "カーボベルデ", "サウジアラビア", "ウルグアイ"],
      "グループI": ["フランス", "セネガル", "イラク", "ノルウェー"],
      "グループJ": ["アルゼンチン", "アルジェリア", "オーストリア", "ヨルダン"],
      "グループK": ["ポルトガル", "コンゴ民主共和国", "ウズベキスタン", "コロンビア"],
      "グループL": ["イングランド", "クロアチア", "ガーナ", "パナマ"]
    };

    const teamToGroup = Object.fromEntries(
      Object.entries(groups).flatMap(([groupName, teamNames]) =>
        teamNames.map((teamName) => [teamName, groupName])
      )
    );

    const stages = [
      ["group", "グループ敗退"],
      ["r32", "ベスト32"],
      ["r16", "ベスト16"],
      ["qf", "ベスト8"],
      ["sf", "ベスト4"],
      ["third", "3位"],
      ["runner", "準優勝"],
      ["champion", "優勝"]
    ];

    const defaultScores = {
      group: 0,
      r32: 0,
      r16: 2,
      qf: 4,
      sf: 6,
      third: 7,
      runner: 8,
      champion: 11
    };

    const groupRankLabels = {
      "": "未入力",
      "1": "1位",
      "2": "2位",
      "3": "3位",
      "4": "4位"
    };

    const defaultGroupScores = {
      "1": 5,
      "2": 3,
      "3": 2,
      "4": 0
    };

    const samplePayload = {
      updatedAt: "2026-06-11T12:00:00+09:00",
      stages: {
        "カナダ": "r32",
        "日本": "r16",
        "ブラジル": "qf",
        "フランス": "sf",
        "アルゼンチン": "champion"
      },
      groupRanks: {
        "カナダ": 2,
        "日本": 1,
        "ブラジル": 1,
        "フランス": 2,
        "アルゼンチン": 1
      },
      matches: [
        { home: "メキシコ", away: "南アフリカ", homeScore: null, awayScore: null, status: "予定" },
        { home: "韓国", away: "チェコ", homeScore: null, awayScore: null, status: "予定" },
        { home: "カナダ", away: "ボスニア・ヘルツェゴビナ", homeScore: null, awayScore: null, status: "予定" }
      ]
    };

    let state = readState();

    function freshState() {
      return {
        players: Array.from({ length: 8 }, (_, index) => `Player ${index + 1}`),
        teams: defaultTeams.map((name) => ({
          name,
          owner: "",
          stage: "group",
          group: teamToGroup[name] || "",
          groupRank: String((groups[teamToGroup[name]] || []).indexOf(name) + 1 || ""),
          groupPosition: String((groups[teamToGroup[name]] || []).indexOf(name) + 1 || "")
        })),
        scores: { ...defaultScores },
        groupScores: { ...defaultGroupScores },
        draftMode: "snake",
        picks: [],
        feedUrl: "",
        live: { updatedAt: "", matches: [] },
        activeTab: "setup"
      };
    }

    function readState() {
      const fromHash = decodeHash();
      if (fromHash) return fromHash;

      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) return normalize(JSON.parse(saved));
      } catch (error) {
        console.warn(error);
      }
      return freshState();
    }

    function normalize(nextState) {
      const base = freshState();
      return {
        ...base,
        ...nextState,
        players: Array.isArray(nextState.players) && nextState.players.length ? nextState.players : base.players,
        teams: Array.isArray(nextState.teams) && nextState.teams.length
          ? nextState.teams.map((team, index) => ({
            ...base.teams[index],
            ...team,
            group: teamToGroup[team.name] || team.group || "",
            groupPosition: String(team.groupPosition || team.groupRank || (groups[teamToGroup[team.name] || team.group] || []).indexOf(team.name) + 1 || ""),
            groupRank: String(team.groupRank || team.groupPosition || (groups[teamToGroup[team.name] || team.group] || []).indexOf(team.name) + 1 || "")
          }))
          : base.teams,
        scores: { ...base.scores, ...(nextState.scores || {}) },
        groupScores: { ...base.groupScores, ...(nextState.groupScores || {}) },
        picks: Array.isArray(nextState.picks) ? nextState.picks : [],
        live: nextState.live && typeof nextState.live === "object" ? nextState.live : base.live
      };
    }

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function encodeState() {
      const json = JSON.stringify(state);
      return btoa(unescape(encodeURIComponent(json)));
    }

    function decodeHash() {
      if (!location.hash.startsWith("#room=")) return null;
      try {
        const json = decodeURIComponent(escape(atob(location.hash.replace("#room=", ""))));
        history.replaceState(null, "", location.pathname);
        return normalize(JSON.parse(json));
      } catch (error) {
        console.warn(error);
        return null;
      }
    }

    function pickOrder() {
      const rounds = Math.ceil(state.teams.length / Math.max(state.players.length, 1));
      const order = [];
      for (let round = 0; round < rounds; round += 1) {
        const playerIndexes = state.players.map((_, index) => index);
        const roundOrder = state.draftMode === "snake" && round % 2 === 1
          ? playerIndexes.reverse()
          : playerIndexes;
        order.push(...roundOrder);
      }
      return order.slice(0, state.teams.length);
    }

    function currentPickerIndex() {
      return pickOrder()[state.picks.length];
    }

    function scoreTeam(team) {
      return Number(state.scores[team.stage] || 0) + Number(state.groupScores[String(team.groupRank)] || 0);
    }

    function teamsInGroup(groupName) {
      return state.teams
        .filter((team) => team.group === groupName)
        .sort((a, b) => Number(a.groupPosition || 99) - Number(b.groupPosition || 99));
    }

    function syncGroupRanksFromPositions(groupName) {
      teamsInGroup(groupName).forEach((team, index) => {
        team.groupPosition = String(index + 1);
        team.groupRank = String(index + 1);
      });
    }

    function moveTeamInGroup(teamName, direction) {
      const team = state.teams.find((item) => item.name === teamName);
      if (!team || !team.group) return;
      const ordered = teamsInGroup(team.group);
      const index = ordered.findIndex((item) => item.name === teamName);
      const swapIndex = index + direction;
      if (index < 0 || swapIndex < 0 || swapIndex >= ordered.length) return;
      const current = ordered[index];
      const target = ordered[swapIndex];
      const currentPos = current.groupPosition;
      current.groupPosition = target.groupPosition;
      target.groupPosition = currentPos;
      syncGroupRanksFromPositions(team.group);
    }

    function playerTeams(player) {
      return state.teams.filter((team) => team.owner === player);
    }

    function playerScore(player) {
      return playerTeams(player).reduce((total, team) => total + scoreTeam(team), 0);
    }

    function showToast(message) {
      const toast = document.querySelector("#toast");
      toast.textContent = message;
      toast.classList.add("show");
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => toast.classList.remove("show"), 1900);
    }

    function render() {
      save();
      renderTabs();
      renderSetup();
      renderDraft();
      renderLive();
      renderResults();
      renderStandings();
    }

    function renderTabs() {
      document.querySelectorAll(".tab").forEach((button) => {
        button.classList.toggle("active", button.dataset.tab === state.activeTab);
      });
      document.querySelectorAll(".panel").forEach((panel) => {
        panel.classList.toggle("active", panel.id === state.activeTab);
      });
    }

    function renderSetup() {
      document.querySelector("#playerCount").value = state.players.length;
      document.querySelector("#draftMode").value = state.draftMode;

      const playerList = document.querySelector("#playerList");
      playerList.innerHTML = state.players.map((player, index) => `
        <div class="player-row">
          <input aria-label="参加者${index + 1}" value="${escapeHtml(player)}" data-player-index="${index}">
          <button class="ghost" data-remove-player="${index}">削除</button>
        </div>
      `).join("");

      document.querySelector("#slotHint").textContent =
        `${state.teams.length}チームを${state.players.length}人で分けます。1人あたり約${Math.floor(state.teams.length / state.players.length)}から${Math.ceil(state.teams.length / state.players.length)}チームです。`;

      document.querySelector("#scoreRules").innerHTML = stages.map(([key, label]) => `
        <label class="score-row">${label}
          <input type="number" value="${state.scores[key]}" data-score-key="${key}">
        </label>
      `).join("");

      document.querySelector("#groupScoreRules").innerHTML = Object.entries(defaultGroupScores).map(([rank]) => `
        <label class="score-row">${groupRankLabels[rank]}
          <input type="number" value="${state.groupScores[rank]}" data-group-score-key="${rank}">
        </label>
      `).join("");
    }

    function renderDraft() {
      const picker = state.players[currentPickerIndex()];
      document.querySelector("#currentPicker").textContent = picker || "ドラフト完了";

      const availableTeams = state.teams.filter((team) => !team.owner);
      document.querySelector("#teamSelect").innerHTML = availableTeams.map((team) =>
        `<option value="${escapeHtml(team.name)}">${escapeHtml(team.name)}</option>`
      ).join("");

      const taken = state.teams.length - availableTeams.length;
      document.querySelector("#draftHint").textContent = `${taken}/${state.teams.length}チーム指名済み`;

      document.querySelector("#draftSummary").innerHTML = state.players.map((player) => {
        const teams = playerTeams(player);
        const names = teams.length
          ? teams.map((team) => `<span class="pill">${escapeHtml(team.name)}</span>`).join("")
          : `<span class="small">まだ指名なし</span>`;
        return `
          <div class="rank-row">
            <span class="badge">${teams.length}</span>
            <div><strong>${escapeHtml(player)}</strong><div class="owned">${names}</div></div>
            <span class="leader-score">${playerScore(player)}</span>
          </div>
        `;
      }).join("");

      const teamList = document.querySelector("#teamSelect");
      document.querySelector("#pickBtn").disabled = !picker || !teamList.value;
    }

    function renderResults() {
      document.querySelector("#teamRows").innerHTML = Object.keys(groups).map((groupName) => `
        <section class="group-card">
          <h3>${escapeHtml(groupName)}</h3>
          ${teamsInGroup(groupName).map((team, index) => `
            <div class="group-team">
              <span class="badge">${index + 1}</span>
              <div class="group-team-meta">
                <strong>${escapeHtml(team.name)}</strong>
                <div class="small">指名者: ${escapeHtml(team.owner || "未指名")} | 現在 ${scoreTeam(team)}点</div>
                <div class="team-row" style="margin-top: 8px;">
                  <select data-stage-team="${escapeHtml(team.name)}">
                    ${stages.map(([key, label]) => `
                      <option value="${key}" ${team.stage === key ? "selected" : ""}>${label}</option>
                    `).join("")}
                  </select>
                  <span class="pill">${groupRankLabels[String(team.groupRank || "")] || "未入力"}</span>
                </div>
              </div>
              <div class="move-buttons">
                <button class="icon-btn" data-move-team="${escapeHtml(team.name)}" data-direction="-1" ${index === 0 ? "disabled" : ""}>↑</button>
                <button class="icon-btn" data-move-team="${escapeHtml(team.name)}" data-direction="1" ${index === 3 ? "disabled" : ""}>↓</button>
              </div>
            </div>
          `).join("")}
        </section>
      `).join("");
    }

    function renderLive() {
      document.querySelector("#feedUrl").value = state.feedUrl || "";
      const updatedText = state.live.updatedAt
        ? `最終取得: ${new Date(state.live.updatedAt).toLocaleString("ja-JP")}`
        : "まだ外部結果を取得していません。";
      document.querySelector("#syncStatus").textContent = updatedText;

      const matches = Array.isArray(state.live.matches) ? state.live.matches : [];
      document.querySelector("#matchList").innerHTML = matches.length
        ? matches.slice(0, 18).map((match) => {
          const score = match.homeScore === null || match.homeScore === undefined
            ? "vs"
            : `${match.homeScore} - ${match.awayScore}`;
          return `
            <div class="team-chip">
              <span>${escapeHtml(match.home)} ${escapeHtml(score)} ${escapeHtml(match.away)}</span>
              <span class="pill">${escapeHtml(match.status || "予定")}</span>
            </div>
          `;
        }).join("")
        : `<p class="small">取得した試合結果がここに出ます。</p>`;
    }

    async function syncResults() {
      const input = document.querySelector("#feedUrl");
      state.feedUrl = input.value.trim();
      if (!state.feedUrl) {
        showToast("結果フィードURLを入れてください");
        render();
        return;
      }

      try {
        if (state.feedUrl === "sample") {
          applyResultPayload(samplePayload);
          state.live.updatedAt = samplePayload.updatedAt;
          state.live.matches = samplePayload.matches;
          render();
          showToast("サンプル結果を反映しました");
          return;
        }

        const response = await fetch(state.feedUrl, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const payload = await response.json();
        applyResultPayload(payload);
        state.live.updatedAt = payload.updatedAt || new Date().toISOString();
        state.live.matches = Array.isArray(payload.matches) ? payload.matches : [];
        render();
        showToast("外部結果を反映しました");
      } catch (error) {
        document.querySelector("#syncStatus").textContent = `取得できませんでした: ${error.message}`;
        showToast("結果を取得できませんでした");
      }
    }

    function applyResultPayload(payload) {
      const updates = {};
      if (payload.stages && typeof payload.stages === "object") {
        Object.assign(updates, payload.stages);
      }
      const rankUpdates = {};
      if (payload.groupRanks && typeof payload.groupRanks === "object") {
        Object.assign(rankUpdates, payload.groupRanks);
      }
      if (Array.isArray(payload.teams)) {
        payload.teams.forEach((team) => {
          if (team.name && team.stage) updates[team.name] = team.stage;
          if (team.name && team.groupRank) rankUpdates[team.name] = team.groupRank;
        });
      }

      state.teams.forEach((team) => {
        const nextStage = updates[team.name];
        if (stages.some(([key]) => key === nextStage)) team.stage = nextStage;
        const nextRank = String(rankUpdates[team.name] || "");
        if (Object.prototype.hasOwnProperty.call(defaultGroupScores, nextRank)) {
          team.groupRank = nextRank;
          team.groupPosition = nextRank;
        }
      });
    }

    function renderStandings() {
      const ranking = state.players
        .map((player) => ({ player, teams: playerTeams(player), score: playerScore(player) }))
        .sort((a, b) => b.score - a.score || b.teams.length - a.teams.length || a.player.localeCompare(b.player, "ja"));

      document.querySelector("#leaderboard").innerHTML = ranking.map((item, index) => `
        <div class="rank-row">
          <span class="badge">${index + 1}</span>
          <div>
            <strong>${escapeHtml(item.player)}</strong>
            <div class="owned">${item.teams.map((team) => `<span class="pill">${escapeHtml(team.name)} ${scoreTeam(team)}</span>`).join("") || `<span class="small">チームなし</span>`}</div>
          </div>
          <span class="leader-score">${item.score}</span>
        </div>
      `).join("");

      const unowned = state.teams.filter((team) => !team.owner);
      const groupOnly = state.teams.filter((team) => team.owner && team.stage === "group");
      document.querySelector("#missingResults").innerHTML = `
        <p class="small">未指名: ${unowned.length}チーム</p>
        <p class="small">結果が初期値のまま: ${groupOnly.length}チーム</p>
        <div class="team-list">
          ${unowned.slice(0, 12).map((team) => `<div class="team-chip">${escapeHtml(team.name)}<span class="pill">未指名</span></div>`).join("")}
        </div>
      `;
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[char]));
    }

    document.querySelectorAll(".tab").forEach((button) => {
      button.addEventListener("click", () => {
        state.activeTab = button.dataset.tab;
        render();
      });
    });

    document.querySelector("#applyPlayers").addEventListener("click", () => {
      const count = Math.max(2, Math.min(16, Number(document.querySelector("#playerCount").value || 8)));
      const names = Array.from({ length: count }, (_, index) => {
        const input = document.querySelector(`[data-player-index="${index}"]`);
        return (input && input.value.trim()) || `Player ${index + 1}`;
      });
      state.players = names;
      state.draftMode = document.querySelector("#draftMode").value;
      state.teams.forEach((team) => {
        if (team.owner && !state.players.includes(team.owner)) team.owner = "";
      });
      state.picks = state.picks.filter((pick) => state.players.includes(pick.player));
      render();
      showToast("参加者を反映しました");
    });

    document.addEventListener("input", (event) => {
      const playerIndex = event.target.dataset.playerIndex;
      const scoreKey = event.target.dataset.scoreKey;
      if (playerIndex !== undefined) {
        state.players[Number(playerIndex)] = event.target.value;
        renderDraft();
        renderStandings();
        save();
      }
      if (scoreKey) {
        state.scores[scoreKey] = Number(event.target.value || 0);
        renderResults();
        renderStandings();
        save();
      }
      const groupScoreKey = event.target.dataset.groupScoreKey;
      if (groupScoreKey) {
        state.groupScores[groupScoreKey] = Number(event.target.value || 0);
        renderResults();
        renderStandings();
        save();
      }
    });

    document.addEventListener("click", (event) => {
      const removeIndex = event.target.dataset.removePlayer;
      if (removeIndex !== undefined) {
        if (state.players.length <= 2) {
          showToast("参加者は2人以上必要です");
          return;
        }
        const removed = state.players[Number(removeIndex)];
        state.players.splice(Number(removeIndex), 1);
        state.teams.forEach((team) => {
          if (team.owner === removed) team.owner = "";
        });
        state.picks = state.picks.filter((pick) => pick.player !== removed);
        render();
        return;
      }
      const moveTeam = event.target.dataset.moveTeam;
      if (moveTeam) {
        moveTeamInGroup(moveTeam, Number(event.target.dataset.direction || 0));
        render();
      }
    });

    document.addEventListener("change", (event) => {
      const teamName = event.target.dataset.stageTeam;
      if (teamName) {
        const team = state.teams.find((item) => item.name === teamName);
        if (team) team.stage = event.target.value;
        render();
      }
    });

    document.querySelector("#feedUrl").addEventListener("input", (event) => {
      state.feedUrl = event.target.value;
      save();
    });

    document.querySelector("#syncBtn").addEventListener("click", syncResults);

    document.querySelector("#sampleBtn").addEventListener("click", () => {
      document.querySelector("#feedUrl").value = "sample";
      state.feedUrl = "sample";
      render();
      showToast("サンプルを選びました");
    });

    document.querySelector("#pickBtn").addEventListener("click", () => {
      const picker = state.players[currentPickerIndex()];
      const teamName = document.querySelector("#teamSelect").value;
      const team = state.teams.find((item) => item.name === teamName);
      if (!picker || !team || team.owner) return;
      team.owner = picker;
      state.picks.push({ player: picker, team: team.name });
      render();
    });

    document.querySelector("#undoBtn").addEventListener("click", () => {
      const last = state.picks.pop();
      if (!last) return;
      const team = state.teams.find((item) => item.name === last.team);
      if (team) team.owner = "";
      render();
      showToast("1つ戻しました");
    });

    document.querySelector("#autoBtn").addEventListener("click", () => {
      while (state.picks.length < state.teams.length) {
        const picker = state.players[currentPickerIndex()];
        const team = state.teams.find((item) => !item.owner);
        if (!picker || !team) break;
        team.owner = picker;
        state.picks.push({ player: picker, team: team.name });
      }
      render();
      showToast("未指名チームを配分しました");
    });

    document.querySelector("#shareBtn").addEventListener("click", async () => {
      const url = `${location.origin}${location.pathname}#room=${encodeState()}`;
      try {
        await navigator.clipboard.writeText(url);
        showToast("共有リンクをコピーしました");
      } catch (error) {
        prompt("このリンクをLINEに貼って送れます", url);
      }
    });

    document.querySelector("#exportBtn").addEventListener("click", () => {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "world-cup-draft.json";
      link.click();
      URL.revokeObjectURL(url);
    });

    document.querySelector("#resetBtn").addEventListener("click", () => {
      if (!confirm("ドラフトと結果をリセットしますか？")) return;
      state = freshState();
      render();
      showToast("リセットしました");
    });

    render();
  </script>
</body>
</html>
